<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Product Details</h1>
    <a href="cart.html">Go to Cart 🛒</a>
</header>

<div id="product-details"></div>

<script>
const products = [
    { id: 1, name: "Stylish Shoes", price: 999, image: "https://via.placeholder.com/300" },
    { id: 2, name: "Smart Watch", price: 1999, image: "https://via.placeholder.com/300" },
    { id: 3, name: "Headphones", price: 1499, image: "https://via.placeholder.com/300" }
];

const id = localStorage.getItem("selectedProduct");
const product = products.find(p => p.id == id);

document.getElementById("product-details").innerHTML = `
    <div class="card">
        <img src="${product.image}">
        <h2>${product.name}</h2>
        <p>₹${product.price}</p>
        <button onclick="addToCart(${product.id})">Add to Cart</button>
    </div>
`;

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(id){
    cart.push(id);
    localStorage.setItem("cart", JSON.stringify(cart));
    alert("Added to cart!");
}
</script>

</body>
</html>
